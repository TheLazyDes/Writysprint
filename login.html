<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panda Login & Signup</title>
    <link rel="stylesheet" href="./css/login.module.css">
</head>
<body class="panda-body">

    <!-- Login Form -->
    <div class="form-container login-form invisible" id="login">
        <div class="panda-head">🐼</div>
        <h2 class="form-title">Log In</h2>
        <form action="./model/login.php" method="post" class="form-box">
            <label for="username-login">Username:</label>
            <input type="text" id="username-login" name="username" class="input-field" required>

            <label for="password-login">Password:</label>
            <input type="password" id="password-login" name="password" class="input-field" required>

            <input type="submit" value="Login" name="action" class="submit-btn">
        </form>
        <p class="form-footer">Don't have an account? <span id="signup-switch" class="form-link signup-link">Sign up</span></p>
    </div>

    <!-- Signup Form -->
    <div class="form-container signup-form" id="signup">
        <div class="panda-head">🐼</div>
        <h2 class="form-title">Sign Up</h2>
        <form action="./model/login.php" method="post" class="form-box">
            <label for="name-signup">Name:</label>
            <input type="text" id="name-signup" name="name" class="input-field" required>

            <label for="username-signup">Username:</label>
            <input type="text" id="username-signup" name="username" class="input-field" required>

            <label for="email-signup">Email:</label>
            <input type="email" id="email-signup" name="email" class="input-field" required>

            <label for="password-signup">Password:</label>
            <input type="password" id="password-signup" name="password" class="input-field" required>

            <input type="submit" value="Signup" name="action" class="submit-btn">
        </form>
        <p class="form-footer">Have an account? <span id="login-switch" class="form-link login-link">Log in</span></p>
    </div>

</body>
<script src="./subscripts/login.js"></script>
</html>
