<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/login.module.css">
</head>
<body>
    <div id="login" class="invisible">
        <h2>Log In to Your Account</h2>
        <form action="./model/login.php" method="post">
        

        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>
        <input type="submit" value="Login" name="action">
    </form>
<p >Don't have an account? <a id="signup-switch" class="link">Sign up</a></p></div>







    <div id="signup">
        <h2>Create An Account</h2>

    <form action="./model/login.php" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required><br><br>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>
        <input type="submit" value="Signup" name="action">
    </form>
<p >Have an account? <a id="login-switch" class="link">Log in</a></p></div>

<script src="./subscripts/login.js">

</script>
</body>
</html>
