<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <!--First Sprint Page-->
    <div id="select-sprint">
    <h2>Select Your Sprint Session</h2>




    <div id="sprint-selection">
        <input type="radio" name="sprint-time" id="5-minutes-radio" value="5">
        <label for="5-minutes-radio">5 minutes</label>

        <input type="radio" name="sprint-time" id="10-minutes-radio" value="10">
        <label for="10-minutes-radio">10 minutes</label>
         
        <input type="radio" name="sprint-time" id="25-minutes-radio" value="25">
        <label for="25-minutes-radio">25 minutes</label>

    <button id="Custom-button">custom</button></div>


    <input type="number" id="custom-sprint" class="invisible">


    <button id="sprint-start" type="submit">start Sprint</button></div>

    <!--Active Sprint Page-->

    <div id="run-sprint" class="invisible">
        <h2 id="sprint-display"></h2>

        <button id="end-sprint">End Sprint</button>
        <button id="pause-sprint">Pause Sprint</button>
        <button id="resume-sprint">Resume Sprint</button>



    </div>


    <script src="Script.js"></script>
</body>

</html>
